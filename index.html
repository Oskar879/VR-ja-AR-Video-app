
<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Video App</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>

  <style>
    body {
      margin: 0;
      background: #151515;
      color: white;
      font-family: Arial, sans-serif;
    }

    #info {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 2;
      background: #222d;
      padding: 12px;
      border-radius: 8px;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    #greenScreenButton {
      background: #555;
      color: white;
      font-weight: bold;
    }

    #greenScreenButton.active {
      background: #168b45;
    }

    #status {
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <div id="info">
    <strong>AR Video App – videotesti</strong>

    <p>Liitä suoran MP4-videon osoite:</p>

    <input
      id="videoUrl"
      type="url"
      placeholder="https://esimerkki.fi/video.mp4"
    >

    <button id="loadVideo">Lataa video</button>

    <button id="greenScreenButton" disabled>
      Green Screen: OFF
    </button>

    <p>Videon koko:</p>
<input
  id="sizeSlider"
  type="range"
  min="0.25"
  max="3"
  step="0.05"
  value="1"
>

<p>Videon korkeus:</p>
<input
  id="heightSlider"
  type="range"
  min="-1"
  max="2"
  step="0.05"
  value="0"
>

    <p>Videon etäisyys:</p>
<input
  id="distanceSlider"
  type="range"
  min="-2"
  max="2"
  step="0.05"
  value="0"
>

<p>Videon suunta:</p>
<input
  id="rotationSlider"
  type="range"
  min="-180"
  max="180"
  step="5"
  value="0"
>

    <p>Etsi tasainen pinta ja napauta näyttöä sijoittaaksesi videon.</p>

    <div id="status">Valmis käynnistämään AR:n.</div>
  </div>

  <script type="module">
    import * as THREE from "three";

    import { ARButton } from
      "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/ARButton.js";

    const status = document.getElementById("status");
    const videoUrlInput = document.getElementById("videoUrl");
    const loadVideoButton = document.getElementById("loadVideo");
    const greenScreenButton = document.getElementById("greenScreenButton");

    const sizeSlider = document.getElementById("sizeSlider");
const heightSlider = document.getElementById("heightSlider");

let currentSize = 1;
let currentHeight = 0;

    const distanceSlider = document.getElementById("distanceSlider");
const rotationSlider = document.getElementById("rotationSlider");

let currentDistance = 0;
let currentRotation = 0;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera();

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 2));

    let video = null;
    let videoTexture = null;
    let videoMaterial = null;
    let videoGeometry = null;
    let greenScreenEnabled = false;

    const videoObjects = [];

    sizeSlider.addEventListener("input", () => {
  currentSize = Number(sizeSlider.value);

  videoObjects.forEach((object) => {
    object.scale.setScalar(currentSize);
  });
});

heightSlider.addEventListener("input", () => {
  currentHeight = Number(heightSlider.value);

  videoObjects.forEach((object) => {
    object.position.y = object.userData.baseY + currentHeight;
  });
});

    distanceSlider.addEventListener("input", () => {
  currentDistance = Number(distanceSlider.value);

  videoObjects.forEach((object) => {
    object.position.z =
      object.userData.baseZ + currentDistance;
  });
});

rotationSlider.addEventListener("input", () => {
  currentRotation = THREE.MathUtils.degToRad(
    Number(rotationSlider.value)
  );

  videoObjects.forEach((object) => {
    const rotation = new THREE.Quaternion()
      .setFromAxisAngle(
        new THREE.Vector3(0, 1, 0),
        currentRotation
      );

    object.quaternion.copy(
      object.userData.baseQuaternion
    );

    object.quaternion.premultiply(rotation);
  });
});

    // Ladataan video.
    loadVideoButton.addEventListener("click", () => {
      const url = videoUrlInput.value.trim();

      if (!url) {
        status.textContent = "Anna ensin videon osoite.";
        return;
      }

      try {
        const parsedUrl = new URL(url);

        if (parsedUrl.protocol !== "https:") {
          status.textContent =
            "Videon osoitteen täytyy käyttää HTTPS-yhteyttä.";
          return;
        }
      } catch {
        status.textContent = "Tarkista videon osoite.";
        return;
      }

      if (video) {
        video.pause();
        video.removeAttribute("src");
        video.load();
      }

      video = document.createElement("video");
      video.src = url;
      video.crossOrigin = "anonymous";
      video.loop = true;
      video.muted = true;
      video.playsInline = true;
      video.preload = "auto";

      video.addEventListener("canplay", async () => {
        try {
          await video.play();

          if (videoTexture) videoTexture.dispose();
          if (videoMaterial) videoMaterial.dispose();
          if (videoGeometry) videoGeometry.dispose();

          videoTexture = new THREE.VideoTexture(video);
          videoTexture.colorSpace = THREE.SRGBColorSpace;

          // Green Screen -materiaali.
          videoMaterial = new THREE.ShaderMaterial({
            uniforms: {
              map: { value: videoTexture },
              keyEnabled: { value: 0.0 },
              threshold: { value: 0.18 },
              softness: { value: 0.12 }
            },

            vertexShader: `
              varying vec2 vUv;

              void main() {
                vUv = uv;
                gl_Position =
                  projectionMatrix *
                  modelViewMatrix *
                  vec4(position, 1.0);
              }
            `,

            fragmentShader: `
              uniform sampler2D map;
              uniform float keyEnabled;
              uniform float threshold;
              uniform float softness;

              varying vec2 vUv;

              void main() {
                vec4 color = texture2D(map, vUv);

                float greenDominance =
                  color.g - max(color.r, color.b);

                float keyedAlpha =
                  1.0 - smoothstep(
                    threshold,
                    threshold + softness,
                    greenDominance
                  );

                float finalAlpha =
                  mix(1.0, keyedAlpha, keyEnabled);

                gl_FragColor =
                  vec4(color.rgb, color.a * finalAlpha);

                if (gl_FragColor.a < 0.01) {
                  discard;
                }
              }
            `,

            transparent: true,
            depthWrite: false,
            side: THREE.DoubleSide
          });

          const aspect = video.videoWidth / video.videoHeight;
          const height = 0.8;
          const width = height * aspect;

          videoGeometry = new THREE.PlaneGeometry(width, height);

          // Uusi video alkaa aina Green Screen OFF -tilassa.
          greenScreenEnabled = false;
          videoMaterial.uniforms.keyEnabled.value = 0.0;

          greenScreenButton.disabled = false;
          greenScreenButton.textContent = "Green Screen: OFF";
          greenScreenButton.classList.remove("active");

          status.textContent =
            "Video ladattu! Voit valita Green Screen -tilan.";

        } catch (error) {
          status.textContent =
            "Videon käynnistys epäonnistui: " + error.message;
        }
      }, { once: true });

      video.addEventListener("error", () => {
        status.textContent =
          "Videon lataaminen epäonnistui. Tarkista suora MP4-linkki.";
      }, { once: true });

      video.load();
      status.textContent = "Ladataan videota...";
    });

    // Green Screen ON/OFF -kytkin.
    greenScreenButton.addEventListener("click", () => {
      if (!videoMaterial) return;

      greenScreenEnabled = !greenScreenEnabled;

      videoMaterial.uniforms.keyEnabled.value =
        greenScreenEnabled ? 1.0 : 0.0;

      if (greenScreenEnabled) {
        greenScreenButton.textContent = "Green Screen: ON";
        greenScreenButton.classList.add("active");
        status.textContent = "Vihreän taustan poisto on käytössä.";
      } else {
        greenScreenButton.textContent = "Green Screen: OFF";
        greenScreenButton.classList.remove("active");
        status.textContent = "Alkuperäinen videokuva käytössä.";
      }
    });

    const reticle = new THREE.Mesh(
      new THREE.RingGeometry(0.08, 0.10, 32),
      new THREE.MeshBasicMaterial({ color: 0x65e879 })
    );

    reticle.rotation.x = -Math.PI / 2;
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    let hitTestSource = null;
    let hitTestRequested = false;

    const controller = renderer.xr.getController(0);

    controller.addEventListener("select", () => {
      if (!reticle.visible) return;

      if (!videoGeometry || !videoMaterial) {
        status.textContent = "Lataa ensin video ennen sijoittamista.";
        return;
      }

      const placedVideo = new THREE.Mesh(
        videoGeometry,
        videoMaterial
      );

placedVideo.position.setFromMatrixPosition(reticle.matrix);
placedVideo.quaternion.setFromRotationMatrix(reticle.matrix);
placedVideo.rotateX(-Math.PI / 2);

placedVideo.userData.baseY = placedVideo.position.y;
placedVideo.userData.baseZ = placedVideo.position.z;

placedVideo.userData.baseQuaternion =
  placedVideo.quaternion.clone();

placedVideo.position.y += currentHeight;
placedVideo.position.z += currentDistance;

placedVideo.scale.setScalar(currentSize);

const initialRotation = new THREE.Quaternion()
  .setFromAxisAngle(
    new THREE.Vector3(0, 1, 0),
    THREE.MathUtils.degToRad(
      Number(rotationSlider.value)
    )
  );

placedVideo.quaternion.premultiply(initialRotation);

      scene.add(placedVideo);
      videoObjects.push(placedVideo);

      status.textContent = "Video sijoitettu onnistuneesti!";
    });

    scene.add(controller);

    const arButton = ARButton.createButton(renderer, {
      requiredFeatures: ["hit-test"]
    });

    document.body.appendChild(arButton);

    renderer.xr.addEventListener("sessionstart", () => {
      status.textContent = "AR käynnissä. Etsi tasainen pinta.";
    });

    renderer.xr.addEventListener("sessionend", () => {
      status.textContent = "AR-istunto päättyi.";
      hitTestSource = null;
      hitTestRequested = false;
    });

    renderer.setAnimationLoop((time, frame) => {
      if (frame) {
        const session = renderer.xr.getSession();
        const referenceSpace = renderer.xr.getReferenceSpace();

        if (!hitTestRequested && session) {
          session.requestReferenceSpace("viewer").then((space) => {
            session.requestHitTestSource({ space }).then((source) => {
              hitTestSource = source;
            });
          });

          hitTestRequested = true;
        }

        if (hitTestSource && referenceSpace) {
          const results = frame.getHitTestResults(hitTestSource);

          if (results.length > 0) {
            const pose = results[0].getPose(referenceSpace);
            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
          } else {
            reticle.visible = false;
          }
        }
      }

      renderer.render(scene, camera);
    });

    window.addEventListener("resize", () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>


<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Video App - AR testi</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>
  <style>
    body {
      margin: 0;
      background: #151515;
      color: white;
      font-family: Arial, sans-serif;
    }

    #info {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 2;
      background: #222d;
      padding: 12px;
      border-radius: 8px;
    }

    button {
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="info">
    <strong>AR Video App – pintatesti</strong>
    <p>Etsi tasainen pinta ja tähtää siihen. Napauta näyttöä sijoittaaksesi kuution.</p>
    <div id="status">Valmis käynnistämään AR:n.</div>
  </div>

  <script type="module">
import * as THREE from "three";

import { ARButton } from
  "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/ARButton.js";

    const status = document.getElementById("status");

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera();

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 2));

    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(0.15, 0.15, 0.15),
      new THREE.MeshStandardMaterial({
        color: 0x35dd65
      })
    );

    const reticle = new THREE.Mesh(
      new THREE.RingGeometry(0.08, 0.10, 32),
      new THREE.MeshBasicMaterial({ color: 0x65e879 })
    );

    reticle.rotation.x = -Math.PI / 2;
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    let hitTestSource = null;
    let hitTestRequested = false;

    const controller = renderer.xr.getController(0);

    controller.addEventListener("select", () => {
      if (!reticle.visible) return;

      const placedCube = cube.clone();
      placedCube.position.setFromMatrixPosition(reticle.matrix);
      placedCube.quaternion.setFromRotationMatrix(reticle.matrix);

      scene.add(placedCube);
      status.textContent = "Kuution sijoitus onnistui!";
    });

    scene.add(controller);

    const arButton = ARButton.createButton(renderer, {
      requiredFeatures: ["hit-test"]
    });

    document.body.appendChild(arButton);

    renderer.xr.addEventListener("sessionstart", () => {
      status.textContent = "AR käynnissä. Etsi tasainen pinta.";
    });

    renderer.xr.addEventListener("sessionend", () => {
      status.textContent = "AR-istunto päättyi.";
      hitTestSource = null;
      hitTestRequested = false;
    });

    renderer.setAnimationLoop((time, frame) => {
      if (frame) {
        const session = renderer.xr.getSession();
        const referenceSpace = renderer.xr.getReferenceSpace();

        if (!hitTestRequested && session) {
          session.requestReferenceSpace("viewer").then((space) => {
            session.requestHitTestSource({ space }).then((source) => {
              hitTestSource = source;
            });
          });

          hitTestRequested = true;
        }

        if (hitTestSource && referenceSpace) {
          const results = frame.getHitTestResults(hitTestSource);

          if (results.length > 0) {
            const pose = results[0].getPose(referenceSpace);
            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
          } else {
            reticle.visible = false;
          }
        }
      }

      renderer.render(scene, camera);
    });

    window.addEventListener("resize", () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
